name: RKU ONE disposable notification digest PostgreSQL tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vip_test_user
          POSTGRES_PASSWORD: local_ci_only_password
          POSTGRES_DB: rku_one_vip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test_user -d rku_one_vip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RKU_VIP_TEST_DATABASE_URL: postgresql://vip_test_user:local_ci_only_password@127.0.0.1:5432/rku_one_vip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable test dependencies
        run: python -m pip install "psycopg[binary]>=3,<4"
      - name: Reject non-disposable DB URLs
        run: python -c 'import os; from staging_db_preflight import assert_disposable_staging_url; assert_disposable_staging_url(os.environ["RKU_VIP_TEST_DATABASE_URL"])'
      - name: Run real concurrent digest tests in isolated schema
        run: python -m unittest discover -s tests -p 'test_notification_digest_postgres_integration.py' -v
