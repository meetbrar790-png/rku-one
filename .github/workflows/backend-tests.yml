name: RKU ONE backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit-test-output.txt
      - name: Show test failures in run summary
        if: failure()
        shell: bash
        run: |
          echo '## RKU ONE test failure details' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the failed job for the full traceback.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f unit-test-output.txt ]; then
            tail -n 150 unit-test-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No unit test log was produced; inspect installation and checkout steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f unit-test-output.txt ]; then
            echo '::error title=RKU ONE tests failed::See the job summary and rku-one-unit-test-output artifact for the Python traceback.'
          fi
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rku-one-unit-test-output
          path: unit-test-output.txt
          if-no-files-found: ignore
