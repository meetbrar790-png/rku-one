name: RKU ONE disposable PostgreSQL VIP tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vip-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vip_test_user
          POSTGRES_PASSWORD: local_ci_only_password
          POSTGRES_DB: rku_one_vip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test_user -d rku_one_vip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RKU_VIP_TEST_DATABASE_URL: postgresql://vip_test_user:local_ci_only_password@127.0.0.1:5432/rku_one_vip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client dependency
        run: python -m pip install "psycopg[binary]>=3,<4"
      - name: Install API staging test dependencies
        run: python -m pip install -r requirements.txt "httpx>=0.27,<1"
      - name: Verify disposable database URL before integration tests
        run: python -c 'import os; from staging_db_preflight import assert_disposable_staging_url; assert_disposable_staging_url(os.environ["RKU_VIP_TEST_DATABASE_URL"])'
      - name: Verify actual disposable PostgreSQL connection
        run: python staging_db_connection_check.py
      - name: Test real registration API handler in isolated schema
        run: python -m unittest discover -s tests -p 'test_actual_registration_api_staging.py' -v
      - name: Verify founder ID 1 remains unchanged and free IDs begin at 1001
        run: python -m unittest discover -s tests -p 'test_production_registration_founder_boundary_postgres.py' -v
      - name: Rehearse concurrent VIP-aware API signups
        run: python -m unittest discover -s tests -p 'test_staging_vip_api_concurrent.py' -v
      - name: Rehearse VIP-aware registration via real API handler
        run: python -m unittest discover -s tests -p 'test_staging_vip_api_integration.py' -v
      - name: Test VIP-aware HTTP registration rollback
        run: python -m unittest discover -s tests -p 'test_staging_vip_http_rollback.py' -v
      - name: Test concurrent duplicate-email HTTP signups
        run: python -m unittest discover -s tests -p 'test_staging_vip_http_duplicate_race.py' -v
      - name: Test concurrent HTTP VIP-aware registrations
        run: python -m unittest discover -s tests -p 'test_staging_vip_http_concurrent.py' -v
      - name: Test VIP-aware HTTP registration with disposable DB
        run: python -m unittest discover -s tests -p 'test_staging_vip_http_registration.py' -v
      - name: Run isolated PostgreSQL integration tests
        run: python -m unittest discover -s tests -p 'test_vip_*prototype.py' -v
      - name: Run transactional allocator concurrency tests
        run: python -m unittest discover -s tests -p 'test_vip_allocator_concurrency.py' -v
      - name: Run cross-path registration and VIP lock tests
        run: python -m unittest discover -s tests -p 'test_vip_cross_path_lock.py' -v
      - name: Run allocator rollback tests
        run: python -m unittest discover -s tests -p 'test_vip_allocator_rollback.py' -v
      - name: Run two-buyer VIP payment PostgreSQL test
        run: python -m unittest discover -s tests -p 'test_vip_two_buyer_payment_postgres.py' -v
      - name: Run VIP payment idempotency PostgreSQL test
        run: python -m unittest discover -s tests -p 'test_vip_payment_idempotency_postgres.py' -v
      - name: Run VIP payment PostgreSQL test
        run: python -m unittest discover -s tests -p 'test_vip_payment_postgres.py' -v
      - name: Run duplicate email VIP PostgreSQL test
        run: python -m unittest discover -s tests -p 'test_vip_duplicate_email_postgres.py' -v
      - name: Run concurrent full registration VIP PostgreSQL test
        run: python -m unittest discover -s tests -p 'test_vip_concurrent_full_registration.py' -v
      - name: Run concurrent VIP hold and registration race
        run: python -m unittest discover -s tests -p 'test_vip_registration_hold_race.py' -v
      - name: Run staging duplicate email and VIP hold regression
        run: python -m unittest discover -s tests -p 'test_vip_staging_duplicate_email.py' -v
      - name: Run VIP reservation and registration integration tests
        run: python -m unittest discover -s tests -p 'test_vip_reservation_registration_service.py' -v
      - name: Run full registration service concurrency and rollback tests
        run: python -m unittest discover -s tests -p 'test_vip_full_service_transactions.py' -v
      - name: Run disposable full registration service tests
        run: python -m unittest discover -s tests -p 'test_vip_full_registration_service.py' -v
      - name: Run full user registration VIP PostgreSQL test
        run: python -m unittest discover -s tests -p 'test_vip_full_registration_postgres.py' -v
      - name: Run VIP hold PostgreSQL transaction tests
        run: python -m unittest discover -s tests -p 'test_vip_hold_postgres.py' -v
      - name: Run VIP reservation durability tests
        run: python -m unittest discover -s tests -p 'test_vip_reservation_durability.py' -v
      - name: Run VIP hold expiry PostgreSQL tests
        run: python -m unittest discover -s tests -p 'test_vip_hold_expiry_postgres.py' -v
      - name: Run VIP PostgreSQL reservation tests
        run: python -m unittest discover -s tests -p 'test_vip_postgres_integration.py' -v
